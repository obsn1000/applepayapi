# PRODUCTION CONFIGURATION
# All sensitive values are loaded from environment variables for security.

server:
  port: ${PORT:8080}

bank:
  amid: ${AMID}
  bank_name: ${BANK_NAME}
  account_number: ${ACCOUNT_NUMBER}
  bank_code: ${BANK_CODE}
  country: ${COUNTRY}
  checksum: ${CHECKSUM}
  bban: ${BBAN}
  amid_isvalid: ${AMID_ISVALID}
  merchant_id: ${MERCHANT_ID}

apple:
  merchant:
    id: ${MERCHANT_ID}
    domain: ${MERCHANT_DOMAIN}
    display-name: ${MERCHANT_DISPLAY_NAME}

# Apple Pay certificate password (used in ApplePayConfig.java)
# Set this in your Railway environment variables
# APPLE_PAY_CERT_PASSWORD: (your cert password)
